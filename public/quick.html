<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick quote</title>
<style>
/* Quick quote: the Pricer in the MacBook notch. Avg Notch's look: black (transparent, so the notch's
   green glow shows through), rounded wells instead of lines, chips, one light pill, one big figure. */
@font-face { font-family: "Nuckle"; src: url("/fonts/Nuckle-Medium.woff2") format("woff2"); font-weight: 500; font-display: swap; }
@font-face { font-family: "Nuckle"; src: url("/fonts/Nuckle-Semibold.woff2") format("woff2"); font-weight: 600; font-display: swap; }
:root { --grey: rgba(255,255,255,.45); --soft: rgba(255,255,255,.72); --well: rgba(255,255,255,.04); --chip: rgba(255,255,255,.08);
  --cream: #F2EFE8; --green: #8FE6AC; --font: "Nuckle", "Helvetica Neue", Helvetica, Arial, sans-serif; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: transparent; color: #fff; font-family: var(--font); font-weight: 500; font-size: 12.5px; line-height: 1.45; letter-spacing: -.01em; -webkit-font-smoothing: antialiased; overflow: hidden; }
.quick { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 10px; height: 100%; }

/* left: what the job is, in a well */
.ask { display: flex; flex-direction: column; min-height: 0; padding: 12px 14px 10px; border-radius: 14px; background: var(--well); transition: background .2s, box-shadow .2s; }
.ask.drop { background: rgba(143,230,172,.08); box-shadow: inset 0 0 0 1.5px var(--green); }
.ask.drop textarea::placeholder { color: #fff; }
textarea { flex: 1; min-height: 0; width: 100%; resize: none; border: 0; background: none; color: #fff; font: inherit; font-size: 13px; line-height: 1.5; padding: 0; outline: none; }
textarea::placeholder { color: var(--grey); }
.foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 6px; font-size: 11.5px; color: var(--grey); min-height: 26px; }
#hint { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; color: var(--soft); }
.doc span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc button, .clear { border: 0; border-radius: 999px; background: var(--chip); color: var(--soft); font: inherit; font-size: 11.5px; height: 24px; padding: 0 11px; cursor: pointer; transition: background .15s, color .15s, transform .15s; }
.doc button:hover, .clear:hover { background: rgba(255,255,255,.13); color: #fff; }
.doc button:active, .clear:active, .btn:active { transform: scale(.93); }

/* right: the rough price, one big figure */
.price { display: flex; flex-direction: column; min-height: 0; padding: 4px 2px 0 6px; }
.label { font-size: 11.5px; color: var(--grey); }
.fig { font-size: 54px; overflow: hidden; font-weight: 600; line-height: 1; letter-spacing: -.05em; font-variant-numeric: tabular-nums; margin-top: 4px; white-space: nowrap;
  background: linear-gradient(135deg, #fff 30%, var(--green)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.days { font-size: 11.5px; color: var(--grey); margin-top: 6px; }
.lines { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; min-height: 0; overflow: hidden; }
.lines li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; height: 26px; padding: 0 10px; border-radius: 9px; background: var(--well); font-size: 11.5px; color: var(--soft); }
.lines li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lines li span:last-child { font-variant-numeric: tabular-nums; color: #fff; }
.lines li.more { color: var(--grey); grid-template-columns: 1fr; background: none; height: auto; padding: 0 10px; }
.go { margin-top: auto; padding-top: 8px; display: flex; justify-content: flex-end; }
.btn { border: 0; border-radius: 999px; background: var(--cream); color: #000; font: inherit; font-size: 11.5px; height: 26px; padding: 0 13px; cursor: pointer; transition: background .15s, opacity .15s, transform .15s; }
.btn:hover:not(:disabled) { background: #fff; }
.btn:disabled { opacity: .35; cursor: default; }
:focus-visible { outline: 1.5px solid var(--green); outline-offset: 3px; }
</style>
</head>
<body>
<main class="quick">
  <section class="ask" id="ask">
    <textarea id="brief" placeholder="Describe the job: what they want, how much of it, and by when. Or drop a brief (PDF, Word or text) on the notch." aria-label="The job"></textarea>
    <div class="foot">
      <span id="hint">A rough price from the description</span>
      <button type="button" class="clear" id="clearBtn" hidden>Clear</button>
    </div>
  </section>
  <section class="price" aria-live="polite">
    <span class="label" id="label">Rough quote</span>
    <div class="fig" id="fig">£0</div>
    <div class="days" id="days">Nothing to price yet</div>
    <ul class="lines" id="lines"></ul>
    <div class="go"><button type="button" class="btn" id="openBtn" disabled>Open in Pricer</button></div>
  </section>
</main>
<script type="module" src="/quick.js"></script>
<script>
// one big figure: as large as fits the column (a range is long)
const fig = document.getElementById('fig');
const fit = () => { fig.style.fontSize = '54px'; const w = fig.parentElement.clientWidth - 8;
  if (fig.scrollWidth > w) fig.style.fontSize = Math.max(26, Math.floor(54 * w / fig.scrollWidth)) + 'px'; };
new MutationObserver(fit).observe(fig, { childList: true, characterData: true, subtree: true });
addEventListener('resize', fit);
document.fonts.ready.then(fit); document.fonts.addEventListener('loadingdone', fit);
</script>
</body>
</html>
