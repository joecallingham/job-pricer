<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick quote</title>
<style>
/* Quick quote: the Pricer in the MacBook notch. Plain, like avgjoe.studio: white Nuckle on black,
   grey for the rest, hairlines, no boxes or pills. */
@font-face { font-family: "Nuckle"; src: url("/fonts/Nuckle-Medium.woff2") format("woff2"); font-weight: 500; font-display: swap; }
@font-face { font-family: "Nuckle"; src: url("/fonts/Nuckle-Semibold.woff2") format("woff2"); font-weight: 600; font-display: swap; }
:root { --grey: rgba(255,255,255,.45); --soft: rgba(255,255,255,.7); --line: rgba(255,255,255,.12);
  --font: "Nuckle", "Helvetica Neue", Helvetica, Arial, sans-serif; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: #000; color: #fff; font-family: var(--font); font-weight: 500; font-size: 12.5px; line-height: 1.45; letter-spacing: -.01em; -webkit-font-smoothing: antialiased; overflow: hidden; }
.quick { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); height: 100%; }

/* left: what the job is */
.ask { display: flex; flex-direction: column; min-height: 0; padding-right: 16px; }
.ask.drop textarea::placeholder { color: #fff; }
textarea { flex: 1; min-height: 0; width: 100%; resize: none; border: 0; background: none; color: #fff; font: inherit; font-size: 13px; line-height: 1.5; padding: 0; outline: none; }
textarea::placeholder { color: var(--grey); }
.foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 6px; font-size: 11.5px; color: var(--grey); min-height: 22px; }
#hint { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; color: var(--soft); }
.doc span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc button, .clear { border: 0; background: none; color: var(--grey); font: inherit; font-size: 11.5px; cursor: pointer; padding: 0; }
.doc button:hover, .clear:hover { color: #fff; }

/* right: the rough price */
.price { display: flex; flex-direction: column; min-height: 0; padding-left: 16px; box-shadow: inset 1px 0 0 var(--line); }
.label { font-size: 11.5px; color: var(--grey); }
.fig { font-size: 26px; line-height: 1.05; letter-spacing: -.04em; font-variant-numeric: tabular-nums; margin-top: 2px; white-space: nowrap; }
.days { font-size: 11.5px; color: var(--grey); margin-top: 2px; }
.lines { list-style: none; margin: 10px 0 0; padding: 0; display: grid; min-height: 0; overflow: hidden; }
.lines li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 4px 0; font-size: 12px; color: var(--soft); box-shadow: inset 0 -1px 0 var(--line); }
.lines li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lines li span:last-child { font-variant-numeric: tabular-nums; color: var(--grey); }
.lines li.more { color: var(--grey); grid-template-columns: 1fr; box-shadow: none; }
.go { margin-top: auto; padding-top: 6px; display: flex; justify-content: flex-end; }
.btn { border: 0; background: none; color: #fff; font: inherit; font-size: 13px; padding: 4px 0; cursor: pointer; }
.btn:not(:disabled)::after { content: " ↘"; }
.btn:disabled { color: var(--grey); cursor: default; }
:focus-visible { outline: 1px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
<main class="quick">
  <section class="ask" id="ask">
    <textarea id="brief" placeholder="Describe the job: what they want, how much of it, and by when. Or drop a brief (PDF, Word or text) on the notch." aria-label="The job"></textarea>
    <div class="foot">
      <span id="hint">A rough price from the description</span>
      <button type="button" class="clear" id="clearBtn" hidden>Clear</button>
    </div>
  </section>
  <section class="price" aria-live="polite">
    <span class="label" id="label">Rough quote</span>
    <div class="fig" id="fig">£0</div>
    <div class="days" id="days">Nothing to price yet</div>
    <ul class="lines" id="lines"></ul>
    <div class="go"><button type="button" class="btn" id="openBtn" disabled>Open in Pricer</button></div>
  </section>
</main>
<script type="module" src="/quick.js"></script>
</body>
</html>
