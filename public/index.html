<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job Pricer</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Pricer">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="stylesheet" href="/style.css">
<script>/* ?notch: the compact layout Avg Notch shows in the MacBook notch */ if (/[?&]notch\b/.test(location.search)) document.documentElement.classList.add('notch');</script>
</head>
<body>
<div class="page">
  <nav class="topnotch" aria-label="Views">
    <div class="tabs" id="tabs">
      <button type="button" data-view="brief" aria-current="page">Brief</button>
      <button type="button" data-view="tasks">Job</button>
      <button type="button" data-view="quote">Quote</button>
      <button type="button" data-view="invoice">Invoice</button>
      <button type="button" data-view="saved">Saved</button>
    </div>
    <span class="progress" aria-hidden="true"></span>
  </nav>

  <main id="main">
    <!-- BRIEF -->
    <section class="view" id="view-brief">
      <div class="inrow"><input id="client" placeholder="Client" autocomplete="off"><label for="client">Client</label></div>
      <div class="inrow"><input id="project" placeholder="Project" autocomplete="off"><label for="project">Project</label></div>
      <div class="inrow"><input id="deadline" placeholder="Deadline" autocomplete="off"><label for="deadline">Deadline</label></div>
      <div class="card glass brief-card">
        <div class="head"><span class="pill">Brief</span></div>
        <textarea id="brief" rows="12" placeholder="Paste the brief, the chat or the list of demands" aria-label="Brief"></textarea>
        <span class="glow" id="glow" aria-hidden="true"></span>
      </div>
      <div class="action">
        <h2>Price it</h2>
        <div class="btns">
          <button type="button" class="btn" id="blankBtn">Start blank</button>
          <button type="button" class="btn primary" id="parseBtn">Price the brief</button>
        </div>
      </div>
    </section>

    <!-- TASKS -->
    <section class="view" id="view-tasks" hidden>
      <div class="card hero" style="--c: var(--mint)">
        <div class="head"><span class="pill">Estimate</span>
          <label class="rate"><span>Day rate £</span><input id="dayRate" type="number" min="50" step="25" inputmode="numeric" aria-label="Day rate in pounds"></label>
        </div>
        <div class="hero-body">
          <div class="lines" id="heroLines"></div>
          <div class="fig range" id="heroFig"></div>
        </div>
      </div>
      <div class="products" id="products"></div>
      <div class="stages" id="stages"></div>
      <div class="grid2">
        <div class="card" style="--c: var(--lav)">
          <div class="head"><span class="pill">Uplifts</span></div>
          <div class="opts" id="uplifts"></div>
        </div>
        <div class="card glass">
          <div class="head"><span class="pill">Extras</span></div>
          <div class="opts" id="extras"></div>
        </div>
      </div>
      <div class="grid3">
        <div class="card glass"><div class="head"><span class="pill">Deliverables</span></div><textarea class="list" id="deliverables" rows="6" aria-label="Deliverables, one per line"></textarea></div>
        <div class="card glass"><div class="head"><span class="pill">Assumptions</span></div><textarea class="list" id="assumptions" rows="6" aria-label="Assumptions, one per line"></textarea></div>
        <div class="card glass"><div class="head"><span class="pill">Not included</span></div><textarea class="list" id="exclusions" rows="6" aria-label="Exclusions, one per line"></textarea></div>
      </div>
      <div class="card glass">
        <div class="head"><span class="pill">Costs at cost + 10%</span><button type="button" class="btn" id="addPass">Add a cost</button></div>
        <div id="passList"></div>
      </div>
    </section>

    <!-- QUOTE -->
    <section class="view" id="view-quote" hidden>
      <div class="card hero" style="--c: var(--mint)">
        <div class="head"><span class="pill" id="qTitle">Quote</span>
          <div class="tog" id="statusTog" style="--tog: var(--mint)"><div class="track" role="group" aria-label="Status"></div></div>
        </div>
        <div class="hero-body">
          <div class="lines" id="qLines"></div>
          <div class="fig range" id="qFig"></div>
        </div>
      </div>
      <div class="rows" id="qRows"></div>
      <div class="grid2">
        <div class="card" style="--c: var(--pist)"><div class="head"><span class="pill">Included</span></div><div id="qIncluded"></div></div>
        <div class="card glass"><div class="head"><span class="pill">Not included</span></div><div id="qExcluded"></div></div>
      </div>
      <div class="action">
        <h2>Send it</h2>
        <div class="btns">
          <button type="button" class="btn" id="saveBtn">Save</button>
          <button type="button" class="btn primary" id="copyBtn">Copy the quote</button>
        </div>
      </div>
    </section>

    <!-- INVOICE -->
    <section class="view" id="view-invoice" hidden>
      <div class="card hero" style="--c: var(--pist)">
        <div class="head"><span class="pill" id="iTitle">Invoice</span><div id="kindTog"></div></div>
        <div class="hero-body">
          <div class="lines" id="iLines"></div>
          <div class="fig range" id="iFig"></div>
        </div>
      </div>
      <div class="stages" id="actuals"></div>
      <div class="grid2">
        <div class="card glass"><div class="head"><span class="pill">Bill to</span></div>
          <textarea class="list" id="clientAddress" rows="4" placeholder="Client address" aria-label="Client address"></textarea>
          <input class="line-in" id="poRef" placeholder="PO number, if they gave one" aria-label="PO number" autocomplete="off">
        </div>
        <div class="card glass"><div class="head"><span class="pill">On the invoice</span></div><div id="iRows"></div></div>
      </div>
      <div class="action">
        <h2>Invoice it</h2>
        <div class="btns"><button type="button" class="btn primary" id="issueBtn">Make the PDF</button></div>
      </div>
      <div class="rows" id="invRows"></div>
      <details class="card glass settings" id="settingsBox">
        <summary><span class="pill">Your details</span></summary>
        <div class="set-grid" id="settingsForm">
          <label>Your name<input name="name" autocomplete="off"></label>
          <label>Trading as<input name="tradingName" autocomplete="off"></label>
          <label class="wide">Address<textarea name="address" rows="3"></textarea></label>
          <label>Email<input name="email" type="email" autocomplete="off"></label>
          <label>Days to pay<input name="termsDays" type="number" min="0" max="120" inputmode="numeric"></label>
          <label>Account name<input name="accountName" autocomplete="off"></label>
          <label>Sort code<input name="sortCode" autocomplete="off" inputmode="numeric"></label>
          <label>Account number<input name="accountNumber" autocomplete="off" inputmode="numeric"></label>
          <label>Next invoice number<input name="nextNumber" type="number" min="1" inputmode="numeric"></label>
        </div>
        <div class="btns"><button type="button" class="btn primary" id="settingsSave">Save details</button></div>
      </details>
    </section>

    <!-- SAVED -->
    <section class="view" id="view-saved" hidden>
      <div class="rows" id="savedRows"></div>
      <div class="action">
        <h2>New quote</h2>
        <div class="btns"><button type="button" class="btn primary" id="newBtn">Start a new one</button></div>
      </div>
    </section>
  </main>
</div>

<div class="bezel" aria-hidden="true"></div>
